services:
  - type: web
    name: rx7-login-admin
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: rx7-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: KEY_PEPPER
        generateValue: true
