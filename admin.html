<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111d"><title>RX7 ADMIN</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="admin">
  <header class="adminHead"><div><div class="brand small">RX7<span>STORE</span></div><h1>ADMIN PANEL</h1><p class="subtitle">GESTIÓN DE KEYS</p></div><button id="logout" class="secondary hidden">Cerrar sesión</button></header>
  <section id="loginCard" class="panel"><h2>Acceso de administrador</h2><form id="adminLogin">
    <label for="username">USUARIO</label><div class="field"><input id="username" autocomplete="username" required placeholder="Usuario administrador"></div>
    <label for="password">CONTRASEÑA</label><div class="field"><input id="password" type="password" autocomplete="current-password" required placeholder="Contraseña"></div>
    <button class="primary" type="submit">ENTRAR AL PANEL</button><p id="adminMsg" class="message"></p>
  </form></section>
  <section id="dashboard" class="panel hidden">
    <div class="sectionTitle"><h2>Crear nueva KEY</h2><span class="pill">ADMINISTRADOR</span></div>
    <form id="createForm">
      <label for="keyLabel">DESCRIPCIÓN (OPCIONAL)</label><div class="field"><input id="keyLabel" maxlength="80" placeholder="Ej. Cliente 01"></div>
      <label for="duration">DURACIÓN</label><select id="duration"><option value="1">1 día</option><option value="7">7 días</option><option value="30" selected>30 días</option><option value="90">90 días</option><option value="365">365 días</option><option value="custom">Personalizada</option><option value="permanent">Permanente</option></select>
      <div id="customWrap" class="hidden"><label for="expiresAt">FECHA Y HORA DE VENCIMIENTO</label><input id="expiresAt" type="datetime-local"></div>
      <button class="primary" type="submit">＋ GENERAR KEY</button><p id="createMsg" class="message"></p>
    </form>
    <div id="newKey" class="newKey hidden"><b>KEY GENERADA — CÓPIALA AHORA</b><code id="newKeyValue"></code><button id="copyKey" class="secondary">Copiar KEY</button><small>Por seguridad no se puede volver a consultar completa.</small></div>
    <div class="sectionTitle keysTitle"><h2>Keys registradas</h2><button id="refresh" class="secondary">Actualizar</button></div>
    <div id="keysList" class="keysList"></div>
  </section>
  <p class="adminFoot"><a href="/">Volver al login</a></p>
</main><script src="/admin.js" defer></script></body></html>
